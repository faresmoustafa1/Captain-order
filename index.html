<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captain Order</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="splashScreen" class="screen splash-screen" aria-label="Captain Order loading screen">
      <h1 class="brand-logo">Captain Order</h1>
    </section>

    <section id="languageScreen" class="screen language-screen is-hidden" aria-label="Choose language">
      <div class="picker-wrap">
        <div class="fade fade-top" aria-hidden="true"></div>
        <div id="languageWheel" class="language-wheel" role="listbox" aria-label="Available languages"></div>
        <div class="selection-band" aria-hidden="true"></div>
        <div class="fade fade-bottom" aria-hidden="true"></div>
      </div>

      <button id="selectButton" class="select-button" type="button">Select</button>
    </section>

    <section id="agentScreen" class="screen agent-screen is-hidden" aria-label="Captain Order assistant">
      <header class="chat-header">
        <span class="chat-header-dot" aria-hidden="true"></span>
        <h2 class="chat-header-title">Captain Order</h2>
      </header>

      <div id="chatMessages" class="chat-messages" role="log" aria-live="polite"></div>

      <div id="chatTyping" class="chat-typing is-hidden" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <form id="chatForm" class="chat-input-row">
        <input
          id="chatInput"
          class="chat-input"
          type="text"
          autocomplete="off"
          placeholder="Type your message…"
          aria-label="Message"
        />
        <button id="chatSend" class="chat-send" type="submit" aria-label="Send">➤</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
